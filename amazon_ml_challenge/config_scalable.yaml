data:
  train_dir: "dataset/train"
  test_dir: "dataset/test"
  output_dir: "output"

normalization:
  abbreviation_file: "configs/abbreviations.json"
  unicode_form: "NFC"
  max_text_length: 500

embedding:
  # NOTE: Full dataset embedding is disabled due to scale (37GB RAM needed)
  # Embeddings are used ONLY for reranking top candidates (optional improvement)
  model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  batch_size: 128
  device: "cpu"
  enabled: false  # Set true only if you have 32+ GB RAM or GPU

blocking:
  tfidf_top_k: 20          # Neighbors per S1 entity from TF-IDF
  ngram_min_sim: 0.15       # Lower = more candidates = higher recall
  max_candidates_per_s1: 100  # Cap per S1 entity
  ngram_size: 3
  chunk_size: 50000          # S1 rows per blocking chunk
  use_cache: true            # Cache blocking results to disk (resume if crash)

matching:
  model_type: "lightgbm"
  n_estimators: 1000         # More trees = better, takes ~10 min
  learning_rate: 0.05
  max_depth: 8
  num_leaves: 63
  threshold: 0.5             # Overwritten by validation calibration
  hard_negative_ratio: 5
  random_negative_ratio: 2
  random_seed: 42
  # LightGBM speed settings for large dataset
  n_jobs: -1                 # Use all CPU cores
  subsample: 0.8             # Row subsampling (faster training)
  colsample_bytree: 0.8      # Feature subsampling

validation:
  split_ratio: 0.2
  random_seed: 42
  val_sample_size: 20000     # Only validate on 20k S1 entities (faster)
