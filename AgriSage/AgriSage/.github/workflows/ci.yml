name: CI Pipeline

on:
  push:
    branches: [main, "dev/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agrisage_test
          POSTGRES_USER: agrisage
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock --requirement requirements-dev.lock
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://agrisage:testpassword@localhost/agrisage_test
          GEMINI_API_KEY: ""
          SECRET_KEY: test-secret-key-ci-only
          ENVIRONMENT: test
        run: alembic upgrade head
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://agrisage:testpassword@localhost/agrisage_test
          GEMINI_API_KEY: ""
          SECRET_KEY: test-secret-key-ci-only
          ENVIRONMENT: test
        run: python -m pytest tests/ -v --tb=short --asyncio-mode=auto
      - name: Run backend compatibility tests
        env:
          DATABASE_URL: postgresql+asyncpg://agrisage:testpassword@localhost/agrisage_test
          GEMINI_API_KEY: ""
          SECRET_KEY: test-secret-key-ci-only
          ENVIRONMENT: test
        run: python -m pytest backend/tests/ -v --tb=short --asyncio-mode=auto

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install --require-hashes --requirement requirements.lock --requirement requirements-dev.lock
      - run: python -m compileall -q backend tests scripts alembic
      - run: python -m ruff check backend/ --select E9,F821 --ignore E501

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: apps/web-expert/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web-expert
        run: npm ci
      - name: Typecheck frontend
        working-directory: apps/web-expert
        run: npm run typecheck
      - name: Build frontend
        working-directory: apps/web-expert
        run: npm run build
      - name: Lint frontend
        working-directory: apps/web-expert
        run: npm run lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'
          cache-dependency-path: requirements.lock
      - name: Check hardcoded secrets
        run: |
          if grep -rn --include="*.py" --include="*.kt" \
             -E '(SECRET_KEY|API_KEY|PASSWORD)\s*=\s*"[a-zA-Z0-9+/]{20,}"' .; then
            echo "FAIL: Hardcoded secret found"
            exit 1
          fi
      - name: Verify .env not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "FAIL: .env is tracked by git"
            exit 1
          fi
      - name: Dependency vulnerability scan
        run: |
          python -m pip install --require-hashes --requirement requirements.lock
          pip-audit -r requirements.lock --fail-on CRITICAL
      - name: SAST scan
        run: |
          bandit -r backend/ -lll

  container:
    runs-on: ubuntu-latest
    needs: [test, lint, web, security]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret Compose environment
        run: cp .env.example .env
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Build backend image
        run: docker build --tag agrisage-ci:${{ github.sha }} .
