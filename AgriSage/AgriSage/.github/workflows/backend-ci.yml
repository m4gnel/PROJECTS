name: Backend CI
on:
  push:
    branches:
      - dev/m1-backend
      - dev/m4-agents
      - dev/m3-rag
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agrisage_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d agrisage_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock --requirement requirements-dev.lock

      - name: Lint with ruff
        run: python -m ruff check backend/ --select E9,F821 --ignore E501

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agrisage_test
          GEMINI_API_KEY: ""
          SECRET_KEY: test-secret-key-ci-only
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --asyncio-mode=auto
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agrisage_test
          GEMINI_API_KEY: ""
          SECRET_KEY: test-secret-key-ci-only
          ENVIRONMENT: test

      - name: Run backend compatibility tests
        run: python -m pytest backend/tests/ -v --tb=short --asyncio-mode=auto
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agrisage_test
          GEMINI_API_KEY: ""
          SECRET_KEY: test-secret-key-ci-only
          ENVIRONMENT: test
