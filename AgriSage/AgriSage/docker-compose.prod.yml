services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agrisage_prod
      POSTGRES_USER: agrisage
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set for production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrisage -d agrisage_prod"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agrisage:${DB_PASSWORD:?DB_PASSWORD must be set for production}@db:5432/agrisage_prod
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set for production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set for production}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set for production}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    command: sh -c "alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost:8000/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_prod_data:
