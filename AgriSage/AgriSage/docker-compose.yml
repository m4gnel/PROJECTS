services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agrisage_dev
      POSTGRES_USER: agrisage
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set; copy .env.example and replace the local placeholder}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrisage -d agrisage_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agrisage:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/agrisage_dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost:8000/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres_data:
